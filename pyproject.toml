[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "mitchell"
dynamic = ["version"]
description = "Cloud-ready gravitational-wave analysis data library using zarr"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "zarr >= 3.0",
    "numpy >= 1.24",
    "fsspec >= 2023.1",
    "click >= 8.0",
    "h5py",
]

[project.scripts]
mitchell = "mitchell.cli:cli"

[project.optional-dependencies]
arviz = [
    "arviz",
]
cloud = [
    "s3fs >= 2023.1",
    "gcsfs >= 2023.1",
]
gwtc = [
    "gwresults @ git+https://github.com/transientlunatic/gwresults.git",
]
dev = [
    "arviz",
    "htcondor",  # its submit-description parser checks the generated Condor files
    "pytest >= 8.0",
    "pytest-cov",
    "ruff",
    "mypy >= 1.0",
]
docs = [
    "sphinx >= 7",
    "kentigern",
    "myst-parser",
    "sphinxcontrib-katex",
    "sphinx-autoapi",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/mitchell"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/mitchell/_version.py"

[tool.ruff]
src = ["src"]
line-length = 88
extend-exclude = ["src/mitchell/_version.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "S", "B", "A", "C4", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = ["arviz", "h5py", "gwresults"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
